<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编辑标签页</title>
<link rel="stylesheet" href="edit-card.css?v=2">
<style>
  html, body { height: 100%; margin: 0; background: var(--chat-bg, #fff); }
  html[data-theme="dark"], html[data-theme="dark"] body { background: #1f242d; }
  #app { height: 100%; }
</style>
</head>
<body>
<div id="app"></div>
<script src="edit-card.js?v=3"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search)
  // 主题：优先 URL 传入的 theme（宿主给确定值），退回读父文档；亮色不设属性（宿主约定）。
  var theme = params.get('theme')
  if (!theme) {
    try { theme = parent.document.documentElement.getAttribute('data-theme') } catch (_e) { /* 跨源宿主忽略 */ }
  }
  if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
  var label = params.get('label') || ''
  var dataUrl = params.get('dataUrl') || '/gateway/file-history'
  if (dataUrl === '/gateway/file-history' && label) dataUrl += '?label=' + encodeURIComponent(label)
  window.UIDesignEditCard.mount(document.getElementById('app'), {
    dataUrl: dataUrl,
    path: params.get('path') || '',
    session: params.get('session') || ''
  })
})()
</script>
</body>
</html>
